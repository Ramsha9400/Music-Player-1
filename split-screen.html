<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player · Split Screen · @stackanddstyle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Showcase page styles (dark theme, fixed look) */
  * { box-sizing: border-box; }

  :root {
    --page: #070a16;
    --panel: #0d1124;
    --line: rgba(255, 255, 255, 0.12);
    --text: #e6e9f5;
    --muted: #7d86a8;
    --html: #ff7a2f;
    --css: #3b9cff;
    --js: #f7d51d;
  }

  html, body { margin: 0; }

  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--page);
    color: var(--text);
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------- Header ---------- */
  .ss-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 28px 18px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .glow-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8b5cf6, #22d3ee);
    box-shadow: 0 0 14px rgba(139, 92, 246, 0.8), 0 0 24px rgba(34, 211, 238, 0.5);
  }

  .brand-name {
    font-size: 18px;
    font-weight: 600;
  }

  .tech {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 6px;
  }

  .tech svg {
    width: 22px;
    height: 22px;
  }

  .pill {
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    font-size: 13px;
    color: var(--text);
  }

  /* ---------- Two panels ---------- */
  .ss-main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: minmax(0, 1fr);   /* panels fill the screen; long code scrolls inside */
    gap: 18px;
    padding: 0 28px 28px;
  }

  .panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }

  .lights {
    display: flex;
    gap: 7px;
  }

  .lights i {
    display: block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
  }

  .lights .r { background: #ff5f57; }
  .lights .y { background: #febc2e; }
  .lights .g { background: #28c840; }

  .titlebar .label {
    font-size: 13px;
    color: var(--muted);
  }

  /* Live preview */
  .preview iframe {
    flex: 1;
    width: 100%;
    min-height: 0;
    border: 0;
    background: #070a16;
  }

  /* Code panel */
  .code-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }

  .tabs {
    display: flex;
    gap: 4px;
  }

  .tab {
    position: relative;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 12px;
    border: 0;
    border-radius: 10px 10px 0 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }

  .tab:hover {
    background: rgba(255, 255, 255, 0.05);
  }

  .tab[aria-selected="true"] {
    background: rgba(255, 255, 255, 0.09);
    color: var(--text);
  }

  .tab[aria-selected="true"]::after {
    content: "";
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 0;
    height: 2px;
    border-radius: 2px;
    background: var(--c);
  }

  .tab[data-file="html"] { --c: var(--html); }
  .tab[data-file="css"] { --c: var(--css); }
  .tab[data-file="js"] { --c: var(--js); }

  .tab svg {
    width: 16px;
    height: 16px;
  }

  .tab:focus-visible,
  .copy-btn:focus-visible,
  .code-area:focus-visible {
    outline: 2px solid #22d3ee;
    outline-offset: 2px;
  }

  .filename {
    margin-left: auto;
    font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .copy-btn {
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    min-width: 72px;
  }

  .copy-btn:hover {
    background: rgba(255, 255, 255, 0.12);
  }

  .code-area {
    flex: 1;
    min-height: 0;
    margin: 0;
    padding: 18px 20px;
    overflow: auto;
    font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
    tab-size: 2;
    color: var(--text);
    scrollbar-width: thin;
    scrollbar-color: #2a3150 transparent;
  }

  .code-area::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  .code-area::-webkit-scrollbar-thumb {
    background: #2a3150;
    border-radius: 8px;
  }

  /* Syntax colors */
  .tok-com { color: #6b7a99; font-style: italic; }
  .tok-str { color: #7ee787; }
  .tok-kw { color: #c084fc; }
  .tok-tag { color: #ff6b8b; }
  .tok-attr { color: #ffb86b; }
  .tok-num { color: #ff9e64; }
  .tok-fn { color: #7aa2ff; }
  .tok-prop { color: #8fb8ff; }

  /* ---------- Narrow screens: stack the panels ---------- */
  @media (max-width: 900px) {
    body {
      height: auto;
      overflow: visible;
    }

    .ss-main {
      grid-template-columns: 1fr;
      grid-template-rows: none;
      padding: 0 16px 24px;
    }

    .preview,
    .code {
      height: 72vh;
      flex: none;
    }
  }
</style>
</head>
<body>

  <header class="ss-header">
    <div class="brand">
      <span class="glow-dot" aria-hidden="true"></span>
      <span class="brand-name">Music Player</span>
      <span class="tech" aria-label="Built with HTML, CSS and JavaScript">
        <!-- HTML5 shield -->
        <svg viewBox="0 0 24 24" aria-hidden="true">

          <text x="12" y="15.5" font-size="8" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Poppins, sans-serif">5</text>
        </svg>
        <!-- CSS3 shield -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#3b9cff" d="M12 2 21 5 19.5 17 12 22 4.5 17 3 5z"/>
          <text x="12" y="15.5" font-size="8" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Poppins, sans-serif">3</text>

        <svg viewBox="0 0 24 24" aria-hidden="true">

      <div class="code-bar">
        <div class="tabs" role="tablist" aria-label="Project files">
          <button class="tab" role="tab" id="tab-html" data-file="html" aria-selected="true" aria-controls="code" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#ff7a2f" d="M12 2 21 5 19.5 17 12 22 4.5 17 3 5z"/>
              <text x="12" y="15.5" font-size="8" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Poppins, sans-serif">5</text>
            </svg>
            HTML
          </button>
          <button class="tab" role="tab" id="tab-css" data-file="css" aria-selected="false" aria-controls="code" tabindex="-1" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#3b9cff" d="M12 2 21 5 19.5 17 12 22 4.5 17 3 5z"/>
              <text x="12" y="15.5" font-size="8" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="Poppins, sans-serif">3</text>

            CSS
          </button>
          <button class="tab" role="tab" id="tab-js" data-file="js" aria-selected="false" aria-controls="code" tabindex="-1" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="3" fill="#f7d51d"/>
              <text x="12" y="16" font-size="8" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="Poppins, sans-serif">JS</text>
            </svg>
            JS
          </button>
        </div>
        <span class="filename" id="fileName">index.html</span>
        <button class="copy-btn" id="copyBtn" type="button">Copy</button>

      <pre class="code-area" id="code" tabindex="0" role="tabpanel" aria-labelledby="tab-html"><code id="codeText"></code></pre>
    </section>

  </main>

  <script>
    /* The build step replaces the empty object below with the real file contents. */
    const FILES = {"html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Lovely · Billie Eilish &amp; Khalid · Music Player<\/title>\n  <link rel=\"stylesheet\" href=\"style.css\">\n<\/head>\n<body>\n  <div class=\"stage\">\n    <p class=\"app-label\">Music Player<\/p>\n\n    <main class=\"player\" aria-label=\"Music player\">\n\n      <!-- Top bar: back (restart) and info toggle -->\n      <header class=\"top-bar\">\n        <button class=\"back-btn\" id=\"backBtn\" type=\"button\">\n          <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 18l-6-6 6-6\"/><\/svg>\n          <span>Back<\/span>\n        <\/button>\n        <button class=\"icon-btn\" id=\"menuBtn\" type=\"button\"\n                aria-label=\"Show track info\" aria-expanded=\"false\" aria-controls=\"info\">\n          <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h16M4 12h16M4 17h16\"/><\/svg>\n        <\/button>\n      <\/header>\n\n      <!-- Now playing -->\n      <section class=\"now\" aria-live=\"polite\">\n        <p class=\"artist\">Billie Eilish &amp; Khalid<\/p>\n        <h1 class=\"title\" id=\"title\">Lovely<\/h1>\n      <\/section>\n\n      <!-- Record with arc volume dial -->\n      <div class=\"dial\" id=\"dial\">\n        <svg class=\"arc\" viewBox=\"0 0 260 260\" aria-hidden=\"true\">\n          <path class=\"arc-line\" d=\"M171.7 15.4 A122 122 0 0 1 171.7 244.6\"/>\n          <circle class=\"arc-knob\" id=\"knob\" r=\"6\" cx=\"171.7\" cy=\"15.4\"/>\n        <\/svg>\n        <span class=\"sign sign-plus\" aria-hidden=\"true\">+<\/span>\n        <span class=\"sign sign-minus\" aria-hidden=\"true\">−<\/span>\n\n        <div class=\"disc\" id=\"disc\">\n          <div class=\"cover\"><\/div>\n        <\/div>\n\n        <!-- Real slider for keyboard and screen readers, visually hidden -->\n        <input type=\"range\" id=\"volume\" class=\"sr-only\" min=\"0\" max=\"100\" value=\"70\" aria-label=\"Volume\">\n      <\/div>\n\n      <!-- Progress -->\n      <div class=\"progress\">\n        <div class=\"times\">\n          <span id=\"current\">00:00<\/span>\n          <span id=\"duration\">03:20<\/span>\n        <\/div>\n        <div class=\"line\">\n          <span class=\"line-dot\" id=\"seekDot\" aria-hidden=\"true\"><\/span>\n          <input type=\"range\" id=\"seek\" class=\"seek-input\" min=\"0\" max=\"200.62\" value=\"0\" aria-label=\"Seek position\">\n        <\/div>\n      <\/div>\n\n      <!-- Transport -->\n      <div class=\"controls\">\n        <button class=\"round\" id=\"prevBtn\" type=\"button\" aria-label=\"Back 10 seconds\">\n          <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 6v12M18 6l-8 6 8 6z\"/><\/svg>\n        <\/button>\n        <button class=\"round solid\" id=\"playBtn\" type=\"button\" aria-label=\"Play\"><\/button>\n        <button class=\"round\" id=\"nextBtn\" type=\"button\" aria-label=\"Forward 10 seconds\">\n          <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M17 6v12M6 6l8 6-8 6z\"/><\/svg>\n        <\/button>\n      <\/div>\n\n      <p class=\"hint\">Space play/pause · ← → seek · ↑ ↓ volume · M info<\/p>\n\n      <!-- Info panel (opened by the top-right button) -->\n      <section class=\"info\" id=\"info\" hidden>\n        <h2>Track info<\/h2>\n        <p>Lovely · Billie Eilish &amp; Khalid<\/p>\n        <p>Duration 03:20<\/p>\n      <\/section>\n\n    <\/main>\n  <\/div>\n\n  <!-- The song file lovely.mp3 must stay in this same folder.\n       Until then the player runs a timer so the controls still work. -->\n  <audio id=\"song\" src=\"lovely.mp3\" preload=\"auto\"><\/audio>\n\n  <p class=\"credit\">Created by @stackanddstyle<\/p>\n\n  <script src=\"script.js\"><\/script>\n<\/body>\n<\/html>\n", "css": "/* ==========================================================\n   CHANGE COLORS HERE\n   Every color in the project comes from these variables.\n   Edit the values below and the whole player updates.\n   ========================================================== */\n:root {\n  --page: #d9d7d2;        /* page background behind the player */\n  --card: #ebe9e4;        /* player body */\n  --ink: #111111;         /* text, outlines and solid buttons */\n  --muted: #5e5e5e;       /* small labels and times */\n  --ring: #b8b8b8;        /* grey outer ring of the record */\n  --disc: #111111;        /* black center of the record */\n  --cover: #8d8d8d;       /* light pattern on the record cover */\n  --line: #1a1a1a;        /* thin arc and progress lines */\n  --knob: #2b2b2b;        /* small dots on the arc and progress */\n  --shadow: rgba(0, 0, 0, 0.22);\n  --focus: #111111;       /* keyboard focus ring */\n}\n\n/* ---------- Base ---------- */\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nhtml {\n  height: 100%;\n}\n\nbody {\n  margin: 0;\n  min-height: 100%;\n  background: var(--page);\n  color: var(--ink);\n  font-family: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  /* Centers the content, but falls back to the top if it is taller than the screen */\n  justify-content: safe center;\n  padding: 20px 16px 80px;\n}\n\n:focus-visible {\n  outline: 3px solid var(--focus);\n  outline-offset: 3px;\n}\n\n/* Hidden from view, still read by screen readers and reached by keyboard */\n.sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  overflow: hidden;\n  clip: rect(0 0 0 0);\n  white-space: nowrap;\n}\n\nsvg {\n  width: 20px;\n  height: 20px;\n  fill: none;\n  stroke: currentColor;\n  stroke-width: 2;\n  stroke-linecap: round;\n  stroke-linejoin: round;\n}\n\n/* ---------- Stage and player body ---------- */\n.stage {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 14px;\n  width: 100%;\n}\n\n.app-label {\n  margin: 0;\n  font-size: 12px;\n  font-weight: 700;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.player {\n  position: relative;\n  width: min(330px, 100%);\n  background: var(--card);\n  border-radius: 28px;\n  box-shadow: 0 24px 50px var(--shadow);\n  padding: 18px 24px 22px;\n}\n\n/* ---------- Top bar ---------- */\n.top-bar {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n}\n\n.back-btn,\n.icon-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 4px;\n  padding: 4px;\n  border: 0;\n  border-radius: 8px;\n  background: none;\n  color: var(--ink);\n  font: inherit;\n  font-size: 14px;\n  font-weight: 700;\n  cursor: pointer;\n}\n\n.icon-btn svg {\n  width: 22px;\n  height: 22px;\n}\n\n/* ---------- Now playing ---------- */\n.now {\n  margin-top: 16px;\n}\n\n.artist {\n  margin: 0;\n  font-size: 13px;\n  font-weight: 700;\n}\n\n.title {\n  margin: 2px 0 0;\n  font-size: 34px;\n  font-weight: 800;\n  line-height: 1.1;\n  letter-spacing: -0.01em;\n}\n\n/* ---------- Dial: record plus arc volume ---------- */\n.dial {\n  position: relative;\n  width: 260px;\n  height: 260px;\n  margin: 18px auto 10px;\n  cursor: pointer;\n  touch-action: none;   /* lets a finger drag the arc on phones */\n}\n\n.arc {\n  position: absolute;\n  inset: 0;\n  width: 260px;\n  height: 260px;\n  overflow: visible;\n  pointer-events: none;\n}\n\n.arc-line {\n  fill: none;\n  stroke: var(--line);\n  stroke-width: 1.4;\n}\n\n.arc-knob {\n  fill: var(--knob);\n  stroke: none;\n}\n\n.sign {\n  position: absolute;\n  font-size: 16px;\n  font-weight: 500;\n  color: var(--ink);\n  pointer-events: none;\n}\n\n.sign-plus {\n  top: 0;\n  right: 74px;\n}\n\n.sign-minus {\n  bottom: 0;\n  right: 74px;\n}\n\n/* The record: grey ring with a black center holding the cover */\n.disc {\n  position: absolute;\n  left: 30px;\n  top: 30px;\n  width: 200px;\n  height: 200px;\n  border-radius: 50%;\n  background: var(--ring);\n  border: 1px solid #9c9c9c;\n  box-shadow: inset 0 0 0 10px #c4c4c4;\n  display: grid;\n  place-items: center;\n  animation: spin 10s linear infinite;\n  animation-play-state: paused;\n}\n\n.disc.is-playing {\n  animation-play-state: running;\n}\n\n.cover {\n  position: relative;\n  width: 116px;\n  height: 116px;\n  border-radius: 50%;\n  background: var(--disc);\n  box-shadow: 0 4px 10px var(--shadow);\n  display: grid;\n  place-items: center;\n}\n\n/* Abstract striped cover art (an original pattern, not the album artwork) */\n.cover::after {\n  content: \"\";\n  width: 44px;\n  height: 62px;\n  background: repeating-linear-gradient(\n    90deg,\n    var(--cover) 0 2px,\n    transparent 2px 4px\n  );\n  opacity: 0.85;\n}\n\n@keyframes spin {\n  to {\n    transform: rotate(360deg);\n  }\n}\n\n/* ---------- Progress ---------- */\n.progress {\n  margin-top: 14px;\n}\n\n.times {\n  display: flex;\n  justify-content: space-between;\n  font-size: 11px;\n  font-weight: 500;\n  font-variant-numeric: tabular-nums;\n  color: var(--ink);\n}\n\n.line {\n  position: relative;\n  height: 16px;\n  margin-top: 4px;\n}\n\n/* The thin line */\n.line::before {\n  content: \"\";\n  position: absolute;\n  left: 0;\n  right: 0;\n  top: 50%;\n  height: 1px;\n  background: var(--line);\n}\n\n/* The dot that shows the playhead (JS moves it with a left %) */\n.line-dot {\n  position: absolute;\n  top: 50%;\n  left: 0;\n  width: 12px;\n  height: 12px;\n  border-radius: 50%;\n  background: var(--knob);\n  transform: translate(-50%, -50%);\n  pointer-events: none;\n}\n\n/* Transparent native slider on top of the line: gives drag, click and keyboard */\n.seek-input {\n  position: absolute;\n  inset: 0;\n  width: 100%;\n  height: 100%;\n  margin: 0;\n  opacity: 0;\n  cursor: pointer;\n}\n\n.progress:focus-within .line::before {\n  outline: 2px solid var(--focus);\n  outline-offset: 4px;\n}\n\n/* ---------- Transport buttons ---------- */\n.controls {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  gap: 24px;\n  margin-top: 22px;\n}\n\n.round {\n  display: grid;\n  place-items: center;\n  width: 46px;\n  height: 46px;\n  padding: 0;\n  border: 1.5px solid var(--ink);\n  border-radius: 50%;\n  background: transparent;\n  color: var(--ink);\n  cursor: pointer;\n  transition: transform 0.2s ease;\n}\n\n.round svg {\n  width: 18px;\n  height: 18px;\n  stroke-width: 2.2;\n}\n\n.round.solid {\n  width: 58px;\n  height: 58px;\n  background: var(--ink);\n  color: var(--card);\n}\n\n.round:hover {\n  transform: scale(1.06);\n}\n\n/* ---------- Hint and info panel ---------- */\n.hint {\n  margin: 16px 0 0;\n  font-size: 11px;\n  line-height: 1.5;\n  text-align: center;\n  color: var(--muted);\n}\n\n.info {\n  margin-top: 14px;\n  padding-top: 12px;\n  border-top: 1px solid var(--line);\n  font-size: 13px;\n  line-height: 1.5;\n}\n\n.info[hidden] {\n  display: none;\n}\n\n.info h2 {\n  margin: 0 0 4px;\n  font-size: 14px;\n  font-weight: 700;\n}\n\n.info p {\n  margin: 0;\n}\n\n/* ---------- Credit pill (bottom-right) ---------- */\n.credit {\n  position: fixed;\n  right: 20px;\n  bottom: 16px;\n  margin: 0;\n  padding: 8px 14px;\n  border-radius: 999px;\n  background: var(--card);\n  color: var(--ink);\n  font-size: 12px;\n  box-shadow: 0 8px 20px var(--shadow);\n}\n\n/* ---------- Motion: respect the user's setting ---------- */\n@media (prefers-reduced-motion: reduce) {\n  .disc {\n    animation: none;\n  }\n\n  *,\n  *::before,\n  *::after {\n    transition: none !important;\n  }\n}\n", "js": "/* ==========================================================\n   Music Player - script.js\n   Plays lovely.mp3 from this folder. If that file is missing,\n   a timer runs instead so every control still works.\n   ========================================================== */\n\n/* ---------- Settings ---------- */\nconst FALLBACK_DURATION = 200.62; // 3:20, length of lovely.mp3; used if the file is missing\nconst SKIP_SECONDS = 10;        // buttons: back and forward 10 s\nconst KEY_SEEK_SECONDS = 5;     // arrow keys: 5 s\nconst KEY_VOLUME_STEP = 5;      // arrow keys: 5 %\nconst STORAGE_KEY = \"lovely-player\";\nconst TRACK_TITLE = \"Lovely\";\nconst TRACK_ARTIST = \"Billie Eilish & Khalid\";\n\n/* Arc geometry (must match the SVG in index.html) */\nconst ARC_CENTER = 130;         // center of the 260 px dial\nconst ARC_RADIUS = 122;         // radius of the arc line\nconst ARC_LIMIT = 70;           // the arc spans -70 to +70 degrees\nconst DIAL_DISC_RADIUS = 105;   // clicks inside this radius do not move the volume\n\n/* Icons (filled with the button's text color) */\nconst ICON_PLAY = '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\" stroke=\"none\"/><\/svg>';\nconst ICON_PAUSE = '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 5h4v14H7zM13 5h4v14h-4z\" fill=\"currentColor\" stroke=\"none\"/><\/svg>';\n\n/* ---------- DOM ---------- */\nconst $ = (id) => document.getElementById(id);\nconst dom = {\n  audio: $(\"song\"),\n  title: $(\"title\"),\n  disc: $(\"disc\"),\n  dial: $(\"dial\"),\n  knob: $(\"knob\"),\n  volume: $(\"volume\"),\n  current: $(\"current\"),\n  duration: $(\"duration\"),\n  seek: $(\"seek\"),\n  seekDot: $(\"seekDot\"),\n  playBtn: $(\"playBtn\"),\n  prevBtn: $(\"prevBtn\"),\n  nextBtn: $(\"nextBtn\"),\n  backBtn: $(\"backBtn\"),\n  menuBtn: $(\"menuBtn\"),\n  info: $(\"info\"),\n};\n\n/* ---------- State ---------- */\nconst state = {\n  position: 0,           // seconds\n  duration: FALLBACK_DURATION,\n  volume: 70,            // 0 to 100\n  playing: false,\n  usingAudio: false,     // true only when lovely.mp3 loaded correctly\n};\n\nlet frameId = null;\nlet lastFrame = 0;\n\n/* ---------- Helpers ---------- */\n\n/** Seconds to m:ss, for example 72 becomes \"01:12\". */\nfunction formatTime(seconds) {\n  const total = Math.floor(seconds);\n  const minutes = String(Math.floor(total / 60)).padStart(2, \"0\");\n  const secs = String(total % 60).padStart(2, \"0\");\n  return `${minutes}:${secs}`;\n}\n\nfunction clamp(value, min, max) {\n  return Math.min(max, Math.max(min, value));\n}\n\n/** Saves volume and position. Storage can be blocked, so errors are ignored. */\nfunction saveState() {\n  try {\n    localStorage.setItem(\n      STORAGE_KEY,\n      JSON.stringify({ position: Math.floor(state.position), volume: state.volume })\n    );\n  } catch (err) {\n    /* Storage unavailable: the player still works. */\n  }\n}\n\n/** Restores saved values. Bad or missing data keeps the defaults. */\nfunction loadState() {\n  try {\n    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));\n    if (!saved) return;\n    if (typeof saved.volume === \"number\") state.volume = clamp(saved.volume, 0, 100);\n    if (typeof saved.position === \"number\") state.position = clamp(saved.position, 0, state.duration);\n  } catch (err) {\n    /* Corrupt data: keep the defaults. */\n  }\n}\n\n/* ---------- Audio file events ---------- */\ndom.audio.addEventListener(\"loadedmetadata\", () => {\n  if (Number.isFinite(dom.audio.duration) && dom.audio.duration > 0) {\n    state.duration = dom.audio.duration;\n    state.usingAudio = true;\n    dom.audio.currentTime = state.position;\n    render();\n  }\n});\n\n// File missing or unreadable: keep using the timer.\ndom.audio.addEventListener(\"error\", () => {\n  state.usingAudio = false;\n});\n\ndom.audio.addEventListener(\"ended\", () => {\n  pause();\n  state.position = 0;\n  render();\n});\n\n/* ---------- Playback ---------- */\n\n/** Runs once per frame while playing. */\nfunction tick(now) {\n  if (!state.playing) return;\n\n  if (state.usingAudio) {\n    state.position = dom.audio.currentTime;\n  } else {\n    state.position += Math.max(0, (now - lastFrame) / 1000);\n    lastFrame = now;\n  }\n\n  // Reached the end of the song: stop at the start.\n  if (state.position >= state.duration) {\n    pause();\n    state.position = 0;\n    render();\n    return;\n  }\n\n  render();\n  frameId = requestAnimationFrame(tick);\n}\n\nfunction startLoop() {\n  cancelAnimationFrame(frameId);\n  lastFrame = performance.now();\n  frameId = requestAnimationFrame(tick);\n}\n\nfunction play() {\n  if (state.playing) return;\n  state.playing = true;\n\n  if (state.usingAudio) {\n    dom.audio.currentTime = state.position;\n    dom.audio.play().catch(() => {\n      // Browser refused audio: switch to the timer.\n      state.usingAudio = false;\n    });\n  }\n\n  startLoop();\n  render();\n  saveState();\n}\n\nfunction pause() {\n  state.playing = false;\n  cancelAnimationFrame(frameId);\n  if (state.usingAudio) dom.audio.pause();\n  render();\n  saveState();\n}\n\nfunction togglePlay() {\n  if (state.playing) {\n    pause();\n  } else {\n    play();\n  }\n}\n\n/** Moves the playhead to a time in seconds. */\nfunction seekTo(seconds) {\n  state.position = clamp(seconds, 0, state.duration);\n  if (state.usingAudio) dom.audio.currentTime = state.position;\n  lastFrame = performance.now();\n  render();\n  saveState();\n}\n\n/** Sets volume (0 to 100) and updates the dial and audio. */\nfunction setVolume(value) {\n  state.volume = clamp(Math.round(value), 0, 100);\n  dom.audio.volume = state.volume / 100;\n  render();\n  saveState();\n}\n\n/* ---------- Info panel and Back ---------- */\nfunction toggleInfo() {\n  const willOpen = dom.info.hidden;\n  dom.info.hidden = !willOpen;\n  dom.menuBtn.setAttribute(\"aria-expanded\", String(willOpen));\n  dom.menuBtn.setAttribute(\"aria-label\", willOpen ? \"Hide track info\" : \"Show track info\");\n}\n\n/** Back closes the info panel if it is open, otherwise restarts the song. */\nfunction goBack() {\n  if (!dom.info.hidden) {\n    toggleInfo();\n    return;\n  }\n  seekTo(0);\n}\n\n/* ---------- Arc volume dial ---------- */\n\n/** Moves the knob on the arc to match the volume. */\nfunction placeKnob(volume) {\n  // 100 % sits at the top (-70 degrees), 0 % at the bottom (+70 degrees).\n  const angle = (ARC_LIMIT - volume * (2 * ARC_LIMIT / 100)) * (Math.PI / 180);\n  dom.knob.setAttribute(\"cx\", (ARC_CENTER + ARC_RADIUS * Math.cos(angle)).toFixed(2));\n  dom.knob.setAttribute(\"cy\", (ARC_CENTER + ARC_RADIUS * Math.sin(angle)).toFixed(2));\n}\n\n/** Converts a pointer position into a volume. Only the right side of the dial responds. */\nfunction volumeFromPointer(event) {\n  const rect = dom.dial.getBoundingClientRect();\n  const dx = event.clientX - (rect.left + rect.width / 2);\n  const dy = event.clientY - (rect.top + rect.height / 2);\n\n  if (dx <= 0 || Math.hypot(dx, dy) < DIAL_DISC_RADIUS) return null;\n\n  const angle = clamp(Math.atan2(dy, dx) * (180 / Math.PI), -ARC_LIMIT, ARC_LIMIT);\n  return ((ARC_LIMIT - angle) / (2 * ARC_LIMIT)) * 100;\n}\n\nlet dragging = false;\n\ndom.dial.addEventListener(\"pointerdown\", (event) => {\n  const value = volumeFromPointer(event);\n  if (value === null) return;\n  dragging = true;\n  dom.dial.setPointerCapture(event.pointerId);\n  setVolume(value);\n});\n\ndom.dial.addEventListener(\"pointermove\", (event) => {\n  if (!dragging) return;\n  const value = volumeFromPointer(event);\n  if (value !== null) setVolume(value);\n});\n\ndom.dial.addEventListener(\"pointerup\", () => { dragging = false; });\ndom.dial.addEventListener(\"pointercancel\", () => { dragging = false; });\n\n/* ---------- Render ---------- */\n\n/** Copies the current state into the page. Safe to call often. */\nfunction render() {\n  dom.title.textContent = TRACK_TITLE;\n  document.title = `${TRACK_TITLE} · ${TRACK_ARTIST} · Music Player`;\n\n  dom.current.textContent = formatTime(state.position);\n  dom.duration.textContent = formatTime(state.duration);\n\n  dom.seek.max = state.duration;\n  dom.seek.value = state.position;\n  const percent = (state.position / state.duration) * 100;\n  dom.seekDot.style.left = `${percent}%`;\n\n  dom.volume.value = state.volume;\n  placeKnob(state.volume);\n\n  dom.disc.classList.toggle(\"is-playing\", state.playing);\n\n  dom.playBtn.innerHTML = state.playing ? ICON_PAUSE : ICON_PLAY;\n  dom.playBtn.setAttribute(\"aria-label\", state.playing ? \"Pause\" : \"Play\");\n}\n\n/* ---------- Events ---------- */\ndom.playBtn.addEventListener(\"click\", togglePlay);\ndom.prevBtn.addEventListener(\"click\", () => seekTo(state.position - SKIP_SECONDS));\ndom.nextBtn.addEventListener(\"click\", () => seekTo(state.position + SKIP_SECONDS));\ndom.backBtn.addEventListener(\"click\", goBack);\ndom.menuBtn.addEventListener(\"click\", toggleInfo);\n\ndom.seek.addEventListener(\"input\", () => seekTo(Number(dom.seek.value)));\ndom.volume.addEventListener(\"input\", () => setVolume(Number(dom.volume.value)));\n\n/* Keyboard shortcuts. Buttons and sliders keep their own native keys. */\ndocument.addEventListener(\"keydown\", (event) => {\n  if (event.ctrlKey || event.metaKey || event.altKey) return;\n\n  const onButton = event.target.closest(\"button\");\n  const onSlider = event.target.matches('input[type=\"range\"]');\n\n  switch (event.key) {\n    case \" \":\n      if (onButton) return;\n      event.preventDefault();\n      togglePlay();\n      break;\n\n    case \"ArrowLeft\":\n      if (onSlider) return;\n      event.preventDefault();\n      seekTo(state.position - KEY_SEEK_SECONDS);\n      break;\n\n    case \"ArrowRight\":\n      if (onSlider) return;\n      event.preventDefault();\n      seekTo(state.position + KEY_SEEK_SECONDS);\n      break;\n\n    case \"ArrowUp\":\n      if (onSlider) return;\n      event.preventDefault();\n      setVolume(state.volume + KEY_VOLUME_STEP);\n      break;\n\n    case \"ArrowDown\":\n      if (onSlider) return;\n      event.preventDefault();\n      setVolume(state.volume - KEY_VOLUME_STEP);\n      break;\n\n    case \"m\":\n    case \"M\":\n      toggleInfo();\n      break;\n\n    case \"Escape\":\n      if (!dom.info.hidden) toggleInfo();\n      break;\n  }\n});\n\n// Save the state when the page is closed or hidden.\nwindow.addEventListener(\"pagehide\", saveState);\n\n/* ---------- Start ---------- */\nfunction init() {\n  loadState();\n  dom.audio.volume = state.volume / 100;\n  render();\n}\n\ninit();\n"};

    const LABELS = { html: "index.html", css: "style.css", js: "script.js" };

    /* Escape text so it can be shown safely as HTML. */
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    /*
     * Syntax highlighter. Each rule is [className, regex].
     * The rule regexes must contain no capturing groups, so group numbers line up.
     * Earlier rules win when two rules match at the same position.
     */
    const RULES = {
      html: [
        ["tok-com", /<!--[\s\S]*?-->/],
        ["tok-str", /"[^"\n]*"|'[^'\n]*'/],
        ["tok-tag", /<!DOCTYPE[^>]*>|<\/?[A-Za-z][\w-]*|\/?>/],
        ["tok-attr", /[\w-]+(?==)/],
      ],
      css: [
        ["tok-com", /\/\*[\s\S]*?\*\//],
        ["tok-str", /"[^"\n]*"|'[^'\n]*'/],
        ["tok-kw", /@[\w-]+/],
        ["tok-prop", /[\w-]+(?=\s*:)/],
        ["tok-num", /#[0-9a-fA-F]{3,8}\b/],
        ["tok-num", /(?<![\w-])-?\d*\.?\d+(?:px|em|rem|vh|vw|ms|s|deg|fr|%)?/],
        ["tok-fn", /[.#]?[A-Za-z][\w-]*(?=\s*[{,])/],
      ],
      js: [
        ["tok-com", /\/\/[^\n]*|\/\*[\s\S]*?\*\//],
        ["tok-str", /"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`/],
        ["tok-kw", /\b(?:const|let|var|function|return|if|else|for|while|of|in|new|try|catch|async|await|class|export|import|from|null|true|false|undefined|this|switch|case|break|continue|throw)\b/],
        ["tok-num", /\b\d+(?:\.\d+)?\b/],
        ["tok-fn", /\b[A-Za-z_$][\w$]*(?=\s*\()/],
      ],
    };

    function highlight(src, rules) {
      const combined = new RegExp(rules.map(([, re]) => "(" + re.source + ")").join("|"), "g");
      let out = "";
      let last = 0;
      let m;
      while ((m = combined.exec(src)) !== null) {
        out += esc(src.slice(last, m.index));
        let cls = "";
        for (let i = 0; i < rules.length; i++) {
          if (m[i + 1] !== undefined) { cls = rules[i][0]; break; }
        }
        out += `<span class="${cls}">${esc(m[0])}</span>`;
        last = m.index + m[0].length;
      }
      return out + esc(src.slice(last));
    }

    const tabs = [...document.querySelectorAll(".tab")];
    const codeText = document.getElementById("codeText");
    const codeArea = document.getElementById("code");
    const fileName = document.getElementById("fileName");
    const copyBtn = document.getElementById("copyBtn");
    let current = "html";
    let copyTimer = null;

    /* Shows one file in the code area. */
    function show(key) {
      current = key;
      tabs.forEach((tab) => {
        const on = tab.dataset.file === key;
        tab.setAttribute("aria-selected", String(on));
        tab.tabIndex = on ? 0 : -1;

      codeArea.setAttribute("aria-labelledby", "tab-" + key);
      fileName.textContent = LABELS[key];
      codeText.innerHTML = highlight(FILES[key], RULES[key]);
      codeArea.scrollTop = 0;
    }

    tabs.forEach((tab) => tab.addEventListener("click", () => show(tab.dataset.file)));

    /* Left and right arrow keys move between tabs. */
    document.querySelector(".tabs").addEventListener("keydown", (event) => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      const order = ["html", "css", "js"];
      const step = event.key === "ArrowRight" ? 1 : -1;
      const next = order[(order.indexOf(current) + step + order.length) % order.length];
      show(next);
      document.getElementById("tab-" + next).focus();
    });

    /* Copy the full file. Falls back to execCommand when the Clipboard API is blocked. */
    copyBtn.addEventListener("click", async () => {
      const text = FILES[current];
      let ok = false;
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch (err) {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
        area.remove();
      }
      if (ok) {
        copyBtn.textContent = "Copied";
        clearTimeout(copyTimer);
        copyTimer = setTimeout(() => { copyBtn.textContent = "Copy"; }, 1400);
      }
    });

    show("html");
  </script>
